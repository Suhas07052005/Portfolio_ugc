<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sahuh Agency | Premium Video Editing</title>
    <meta name="description" content="Transform your content with cinematic video editing. Sahuh Agency delivers premium short-form edits that captivate audiences.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Particle Canvas Background -->
    <canvas id="particles"></canvas>

    <!-- Background Audio (plays after intro) -->
    <audio id="bgAudio" loop preload="auto"></audio>

    <!-- Hidden Admin Trigger Dot (triple-click to open admin.html) -->
    <div id="adminDot"></div>

    <!-- ===== INTRO SCREEN ===== -->
    <section id="introScreen" class="screen active">
        <div class="intro-content">
            <div class="logo-glow"></div>
            <h1 class="agency-name" id="agencyTitle">
                <span class="name-line main" id="nameMain">SAHUH</span>
                <span class="name-line sub" id="nameSub">AGENCY</span>
            </h1>
            <p class="tagline" id="tagline">Premium Video Editing</p>
            <button id="mainPlayBtn" class="play-btn-hero" aria-label="Enter Portfolio">
                <span class="play-ring"></span>
                <span class="play-ring ring-2"></span>
                <span class="play-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="play-icon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </span>
            </button>
            <p class="play-hint" id="playHint">Tap to explore</p>
        </div>
    </section>

    <!-- ===== PORTFOLIO SCREEN ===== -->
    <section id="portfolioScreen" class="screen">
        <div class="portfolio-inner">
            <div class="portfolio-header">
                <h2 class="section-title"><span id="secTitle">Our</span> <span class="gradient-text" id="secAccent">Work</span></h2>
                <p class="section-sub" id="secSub">Cinematic edits that tell your story</p>
            </div>
            <div class="video-grid" id="videoGrid">
                <!-- Video cards generated by JS from Firebase -->
            </div>
            <div class="cta-section">
                <button id="ctaBtn" class="cta-button" aria-label="Get Sample Edit">
                    <span class="cta-glow"></span>
                    <span id="ctaBtnText" class="cta-text">Get Sample Edit</span>
                    <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </section>

    <!-- ===== FULLSCREEN VIDEO PLAYER OVERLAY ===== -->
    <div id="videoOverlay" class="video-overlay">
        <button id="closeVideo" class="close-video-btn" aria-label="Close video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <div id="videoPlayerContainer" class="video-player-container"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <!-- Vimeo Player API (for thumbnail frame display) -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    <!-- Portfolio Script -->
    <script src="script.js"></script>
</body>
</html>
